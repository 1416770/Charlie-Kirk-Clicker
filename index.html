<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlie Kirk Clicker</title>
    <script src="index.js"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body id="body">
    <h1 id="mainTitle" class="title title2 hasBorder">Kirk Clicker 1.1</h1>
    <h id="kirkies" class="title title2 hasBorder">Kirkies: 0</h>

    <input onclick="onKirkButton()" id="kirkButton" type="image" src="https://lifesurge.com/wp-content/uploads/charlie-kirk-memorial-tribute.webp">

    <div id="upgrades" class="hasBorder">
        <div class="upgradeOption hasBorder">
            <input onclick="onUpgradeButton('kirkFarmer')" type="image" src="https://lifesurge.com/wp-content/uploads/charlie-kirk-memorial-tribute.webp">
            <h id="kirkFarmer" class="title"></h>
        </div>

        <div class="upgradeOption hasBorder">
            <input onclick="onUpgradeButton('elon')" type="image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmLeYECnJd_F8NfFgRKBt-TXfnVYi3K8BwJoPrbAth2g">
            <h id="elon" class="title"></h>
        </div>

        <div class="upgradeOption hasBorder">
            <input onclick="onUpgradeButton('trump')" type="image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTl-OFP4oyXMBrFrge_fFMlcxzmtNiEI4dROXpLy8fzEQ">
            <h id="trump" class="title"></h>
        </div>

        <div class="upgradeOption hasBorder">
            <input onclick="onUpgradeButton('drHouse')" type="image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXfqTIEXpNrg-DNUn0O2lPV3X06sulUUmyqbKT06Zj6Q">
            <h id="drHouse" class="title"></h>
        </div>

        <div class="upgradeOption hasBorder">
            <input onclick="onUpgradeButton('drForeman')" type="image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQS8srJTUo3LCJNLOxcC4PDW20PjRPY305_tTPrXDRGzw">
            <h id="drForeman" class="title"></h>
        </div>
    </div>
</body>
</html>
